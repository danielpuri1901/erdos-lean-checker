name: check-submits
# Polls the agent repository every 2 minutes and starts verify.yml for each submit(<target>): commit
# that has no comparator/<target> status yet. Nothing in the agent repository can trigger this.
# GitHub's own schedule is unreliable (it fired twice in 7.5 hours on 2026-10-03), so one run keeps
# polling until nothing was pushed for 2 hours, and near the 6-hour job limit it starts a fresh run of itself.
# Start it by hand when a run begins; the schedule below only restarts it if it ever stopped.
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: check-submits
jobs:
  poll:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Poll for submit( commits without a verdict
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
          CHECKER_TOKEN: ${{ github.token }}
        run: python3 -u scripts/pending_submits.py --loop
