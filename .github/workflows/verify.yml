name: verify
on:
  workflow_dispatch:
    inputs:
      agent_commit:
        description: Commit of erdos-lean-formalization to verify
        required: true
      target:
        description: Target id (file stem in challenge/ and comparator/)
        required: true
  # check-submits.yml calls this for every submit( commit without a verdict.
  workflow_call:
    inputs:
      agent_commit:
        type: string
        required: true
      target:
        type: string
        required: true
    secrets:
      AGENT_REPO_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TARGET: ${{ inputs.target }}
      AGENT_COMMIT: ${{ inputs.agent_commit }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Check out the agent repository at the commit under test
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: danielpuri1901/erdos-lean-formalization
          ref: ${{ inputs.agent_commit }}
          path: agent
          token: ${{ secrets.AGENT_REPO_TOKEN }}
          # The token can write commit statuses; never leave it where agent code can read it.
          persist-credentials: false
      - name: Report pending status
        run: |
          gh api -X POST "repos/danielpuri1901/erdos-lean-formalization/statuses/$AGENT_COMMIT" \
            -f state=pending -f context="comparator/$TARGET" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
      - name: Freeze the challenge and the build configuration
        # Comparator trusts the lakefile and every prebuilt olean, so the agent's copies are replaced or removed.
        run: |
          cp "challenge/$TARGET.lean" agent/Challenge.lean
          cp "scripts/axioms/$TARGET.lean" agent/AxiomCheck.lean
          cp frozen/lakefile.toml frozen/lake-manifest.json frozen/lean-toolchain agent/
          rm -rf agent/lakefile.lean agent/.lake agent/.claude agent/scripts/hooks
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch dependencies and Mathlib cache
        working-directory: agent
        run: lake exe cache get
      - name: Build the frozen challenge
        # Only trusted code is built outside the sandbox. Comparator builds Solution under landrun.
        working-directory: agent
        run: lake build Challenge
      - name: Clone Comparator (pinned) and match the agent's Lean version
        run: |
          git clone https://github.com/leanprover/comparator .tools/comparator
          git -C .tools/comparator checkout 3927ad383f208ae977c340a91c48ac9b497d2097
          cp frozen/lean-toolchain .tools/comparator/lean-toolchain
      - name: Restore Comparator build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/comparator/.lake
          key: comparator-3927ad3-${{ hashFiles('frozen/lean-toolchain') }}-${{ runner.os }}
      - name: Build Comparator and lean4export
        working-directory: .tools/comparator
        run: lake build lean4export comparator
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 'stable'
      - name: Build landrun (pinned)
        run: GOBIN="$RUNNER_TEMP/landrun-bin" go install github.com/zouuup/landrun/cmd/landrun@5ed4a3db3a4a
      - name: Landrun smoke test
        run: |
          "$RUNNER_TEMP/landrun-bin/landrun" --best-effort --ro / --rw /dev \
            -ldd -add-exec /usr/bin/echo hello
      - name: Close the Docker socket
        # landrun does not filter AF_UNIX connections (Comparator README), and the runner user can reach Docker.
        run: sudo systemctl stop docker.socket docker.service
      - name: Add swap so a large kernel check slows down instead of killing the runner
        # Two submissions on 2026-10-03 (de3bff9, de563a7) built 4 heavy modules at once and the runner was shut down.
        # continue-on-error: a swap failure must never turn into a wrong verdict.
        continue-on-error: true
        # The swap file shares the root disk with Mathlib, so it takes at most free space minus 8 GB:
        # a fixed 24 GB file filled the disk on 2026-10-03 and the runner died ("No space left on device").
        run: |
          df -h / /mnt | tee -a "$GITHUB_STEP_SUMMARY"
          avail=$(df --output=avail -BG /mnt | tail -n 1 | tr -dc 0-9)
          size=$(( avail - 8 > 16 ? 16 : avail - 8 ))
          if [ "$size" -ge 4 ]; then
            sudo fallocate -l "${size}G" /mnt/checker.swap && sudo chmod 600 /mnt/checker.swap
            sudo mkswap /mnt/checker.swap >/dev/null && sudo swapon /mnt/checker.swap
          else
            echo "only ${avail} GB free: no extra swap" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          free -h | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run Comparator
        id: comparator
        # The verdict is Comparator's exit code. The log also holds the solution's own build output,
        # which can print any text, so a matching line anywhere in it proves nothing.
        run: |
          set -o pipefail
          AGENT_DIR="$PWD/agent" \
          COMPARATOR_BIN="$PWD/.tools/comparator/.lake/build/bin/comparator" \
          COMPARATOR_LEAN4EXPORT="$PWD/.tools/comparator/.lake/packages/lean4export/.lake/build/bin/lean4export" \
          COMPARATOR_LANDRUN="$RUNNER_TEMP/landrun-bin/landrun" \
          bash scripts/check.sh "comparator/$TARGET.json" 2>&1 | tee comparator.log
          [ "$(tail -n 1 comparator.log)" = "Your solution is okay!" ]
      - name: Report final status
        if: always()
        # On failure the description is Comparator's last line (GitHub keeps at most 140 characters).
        run: |
          STATE=failure; [ "${{ steps.comparator.outcome }}" = "success" ] && STATE=success
          DESC="Your solution is okay!"
          if [ "$STATE" = failure ]; then
            DESC=$(grep -v '^[[:space:]]*$' comparator.log 2>/dev/null | tail -n 1 | cut -c1-140)
            DESC=${DESC:-"no Comparator verdict: an earlier step failed"}
          fi
          gh api -X POST "repos/danielpuri1901/erdos-lean-formalization/statuses/$AGENT_COMMIT" \
            -f state=$STATE -f context="comparator/$TARGET" -f description="$DESC" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
      - name: Axiom audit (documentation, after the verdict)
        # Imports the Solution olean outside the sandbox, so it runs only after the status is written.
        if: steps.comparator.outcome == 'success'
        working-directory: agent
        run: lake env lean AxiomCheck.lean | tee ../axioms.log
      - name: Upload Comparator log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: comparator-log-${{ inputs.target }}
          path: |
            comparator.log
            axioms.log
          if-no-files-found: ignore
  negative:
    if: inputs.target == 'trivial'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        bad: [sorry, axiom, native_decide, wrong_statement, redefine, print_ok]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: danielpuri1901/erdos-lean-formalization
          ref: ${{ inputs.agent_commit }}
          path: agent
          token: ${{ secrets.AGENT_REPO_TOKEN }}
          persist-credentials: false
      - name: Freeze challenge and build configuration, plant the bad solution
        run: |
          cp challenge/trivial.lean agent/Challenge.lean
          cp frozen/lakefile.toml frozen/lake-manifest.json frozen/lean-toolchain agent/
          rm -rf agent/lakefile.lean agent/.lake
          cp "tests/bad/${{ matrix.bad }}.lean" agent/Solution.lean
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch dependencies and Mathlib cache
        working-directory: agent
        run: lake exe cache get
      - name: Build the frozen challenge
        working-directory: agent
        run: lake build Challenge
      - name: Clone Comparator (pinned) and match the agent's Lean version
        run: |
          git clone https://github.com/leanprover/comparator .tools/comparator
          git -C .tools/comparator checkout 3927ad383f208ae977c340a91c48ac9b497d2097
          cp frozen/lean-toolchain .tools/comparator/lean-toolchain
      - name: Restore Comparator build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/comparator/.lake
          key: comparator-3927ad3-${{ hashFiles('frozen/lean-toolchain') }}-${{ runner.os }}
      - name: Build Comparator and lean4export
        working-directory: .tools/comparator
        run: lake build lean4export comparator
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 'stable'
      - name: Build landrun (pinned)
        run: GOBIN="$RUNNER_TEMP/landrun-bin" go install github.com/zouuup/landrun/cmd/landrun@5ed4a3db3a4a
      - name: Close the Docker socket
        run: sudo systemctl stop docker.socket docker.service
      - name: Comparator must reject
        # Same verdict rule as the verify job: Comparator's exit code and its exact last line.
        run: |
          set +e
          AGENT_DIR="$PWD/agent" \
          COMPARATOR_BIN="$PWD/.tools/comparator/.lake/build/bin/comparator" \
          COMPARATOR_LEAN4EXPORT="$PWD/.tools/comparator/.lake/packages/lean4export/.lake/build/bin/lean4export" \
          COMPARATOR_LANDRUN="$RUNNER_TEMP/landrun-bin/landrun" \
          bash scripts/check.sh comparator/trivial.json 2>&1 | tee comparator.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 0 ] && [ "$(tail -n 1 comparator.log)" = "Your solution is okay!" ]; then
            echo "FAIL: bad solution ${{ matrix.bad }} was accepted"; exit 1
          fi
          echo "rejected as expected (exit $rc): $(tail -n 1 comparator.log)"
